# The photo work-order bot in Docker (DEPLOY.md §"Photo work-order bot"). Once:
#   docker compose -f tools/wo-bot/compose.yaml up -d --build
# After that, switch it on and off in Docker Desktop ▸ Containers ▸ meter-log ▸
# wo-bot; its console (refused Telegram ids, errors) is that container's Logs tab.
# Never run `node tools/wo-bot/bot.mjs` while this is up: Telegram allows one
# poller per bot, and the second one gets "409 Conflict".
name: meter-log
services:
  wo-bot:
    build: .
    image: meter-log-wo-bot
    container_name: meter-log-wo-bot
    restart: unless-stopped   # comes back with Docker Desktop until you stop it
    init: true                # so a stop is instant instead of a 10 s timeout
    environment:
      OLLAMA_URL: http://host.docker.internal:11434   # Ollama runs on Windows, not in Docker
    volumes:
      - ../../js:/app/js:ro          # config.js: the spine URL + token
      - ./:/app/tools/wo-bot         # the code, config.local.json, state.local.json (/link)
